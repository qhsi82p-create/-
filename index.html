<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>正大优鲜 · 商品验收标准查询</title>
<style>
:root{
  --green:#16a34a; --green-d:#15803d; --green-l:#eafaf0;
  --orange:#ea7317; --orange-l:#fff3e8;
  --red:#dc2626; --red-l:#fef2f2;
  --amber:#b45309; --amber-l:#fffbeb;
  --ink:#111827; --ink-2:#4b5563; --ink-3:#9ca3af;
  --line:#e5e7eb; --bg:#f6f7f9; --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* ===== Header ===== */
.top{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:18px 20px 14px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:46px;height:46px;border-radius:10px;flex:none;object-fit:cover;display:block;
}
.brand .tt{font-size:17px;font-weight:700;color:var(--ink)}
.brand .ts{font-size:12px;color:var(--ink-3);margin-top:1px}
.search{
  margin-top:14px;display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  transition:border-color .15s, box-shadow .15s;
}
.search:focus-within{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search .clear{display:none;cursor:pointer;color:var(--ink-3);font-size:14px;background:#fff;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;line-height:20px;padding:0}
/* ===== Segmented tabs ===== */
.type-tabs{display:flex;gap:6px;padding:12px 20px 0}
.type-tabs button{
  flex:1;padding:8px 0;border:none;border-radius:10px;background:transparent;
  font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;transition:all .15s;
}
.type-tabs button.active{background:var(--ink);color:#fff}
.type-tabs button .cnt{font-size:11px;font-weight:400;opacity:.7;margin-left:2px}
/* ===== Chips ===== */
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:16px;
  background:var(--card);font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.chips button.active{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:600}
.stats{padding:8px 20px 4px;font-size:12.5px;color:var(--ink-3)}
.stats b{color:var(--green-d)}
/* ===== Content ===== */
.list{padding:8px 16px 24px;display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:680px){.list{grid-template-columns:1fr 1fr}}
/* ===== Home landing ===== */
.home{padding:36px 24px 20px;text-align:center}
.home .hi{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.5px}
.home .tip{font-size:13.5px;color:var(--ink-3);margin-top:8px;line-height:1.7}
.entry-cards{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:480px;margin-left:auto;margin-right:auto}
.entry{
  border-radius:18px;padding:26px 18px 22px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s, box-shadow .15s;text-align:left;
}
.entry:active{transform:scale(.97)}
.entry .big{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.entry .en{font-size:15px;font-weight:700;margin-top:8px}
.entry .ec{font-size:12px;margin-top:3px;opacity:.75}
.entry.fruit{background:linear-gradient(160deg,#fff5ec,#ffe8d4);color:#9a4d12}
.entry.veg{background:linear-gradient(160deg,#e9f9ef,#d4f2df);color:#14692f}
/* ===== Category grid ===== */
.cat-head{padding:14px 20px 10px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between}
.cat-head .back{color:var(--green-d);cursor:pointer;font-size:13px;font-weight:600}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 24px}
@media(min-width:680px){.cat-grid{grid-template-columns:1fr 1fr 1fr}}
.cat-card{
  background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer;
  border:1px solid var(--line);transition:transform .12s;
}
.cat-card:active{transform:scale(.97)}
.cat-card .cn{font-size:14.5px;font-weight:700;color:var(--ink)}
.cat-card .cc{font-size:12px;color:var(--ink-3);margin-top:3px}
/* ===== Product card ===== */
.card{
  background:var(--card);border-radius:14px;padding:15px 16px;cursor:pointer;
  border:1px solid var(--line);transition:transform .1s, box-shadow .15s;
}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.card:active{transform:scale(.985)}
.card .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{font-size:16px;font-weight:700;color:var(--ink)}
.card .badge{flex:none;font-size:11px;padding:3px 9px;border-radius:8px;font-weight:600}
.badge.fruit{background:var(--orange-l);color:var(--orange)}
.badge.veg{background:var(--green-l);color:var(--green-d)}
.card .meta{margin-top:7px;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:3px 12px}
.card .meta span b{color:var(--ink-2);font-weight:500}
.card .alias{margin-top:5px;font-size:12px;color:var(--ink-3)}
.card .alias b{color:var(--ink-2);font-weight:500}
/* ===== Empty ===== */
.empty{padding:80px 20px;text-align:center;color:var(--ink-3)}
.empty .icon{font-size:38px;margin-bottom:12px;opacity:.35}
/* ===== Detail drawer ===== */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;left:0;right:0;bottom:0;top:0;z-index:31;background:var(--bg);
  transform:translateY(100%);transition:transform .28s ease;
  display:flex;flex-direction:column;max-width:680px;margin:0 auto;
}
.drawer.show{transform:translateY(0)}
.drawer-head{background:var(--card);padding:16px 18px 14px;border-bottom:1px solid var(--line);flex:none}
.drawer-head .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-head .title{font-size:20px;font-weight:700}
.drawer-head .close{flex:none;width:32px;height:32px;border:none;border-radius:50%;background:var(--bg);font-size:15px;cursor:pointer;color:var(--ink-2)}
.drawer-head .sub{margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.head-meta{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.head-meta .m{background:var(--bg);border-radius:8px;padding:7px 10px}
.head-meta .m .k{font-size:11px;color:var(--ink-3)}
.head-meta .m .v{font-size:13px;color:var(--ink);font-weight:600;margin-top:1px;word-break:break-all}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px 40px}
.sec{margin-bottom:16px}
.sec-h{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.sec-h::before{content:"";width:4px;height:14px;background:var(--green);border-radius:2px}
.dim-grid{display:grid;gap:10px}
.dim{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.dim .dim-title{font-size:13px;font-weight:700;color:var(--ink);padding:9px 13px;background:#fafbfc;border-bottom:1px solid var(--line)}
.dim .pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
@media(max-width:520px){.dim .pair{grid-template-columns:1fr}}
.dim .cell{padding:10px 13px;background:var(--card);font-size:13.5px;line-height:1.65}
.dim .cell.ok{border-left:3px solid var(--green)}
.dim .cell.bad{border-left:3px solid var(--red)}
.dim .cell .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;margin-bottom:5px}
.dim .cell.ok .tag{background:var(--green-l);color:var(--green-d)}
.dim .cell.bad .tag{background:var(--red-l);color:var(--red)}
.dim .cell.empty-cell{color:var(--ink-3);font-style:italic;font-size:12.5px}
.alert-box{border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.7}
.alert-box.red{background:var(--red-l);color:#7f1d1d;border-left:3px solid var(--red)}
.alert-box.amber{background:var(--amber-l);color:#78350f;border-left:3px solid var(--amber)}
.alert-box .t{font-weight:700;margin-bottom:4px;font-size:13px}
.kv{background:var(--card);border-radius:12px;padding:11px 14px;font-size:13.5px;border:1px solid var(--line)}
.kv p{margin-bottom:6px}
.kv p:last-child{margin-bottom:0}
.kv .k{color:var(--ink-3);font-size:12px;margin-right:6px}
footer{padding:24px;text-align:center;font-size:11.5px;color:var(--ink-3)}
</style>
</head>

// ===== State =====
const state = { type:'all', group:'全部', q:'' };
const $ = id => document.getElementById(id);

// ===== Build groups =====
function groupList(){
  const set = new Set(['全部']);
  GOODS.forEach(g=>{
    if(state.type==='all' || g.cat===state.type){
      set.add(g.group || '其他');
    }
  });
  return [...set];
}
function refreshCounts(){
  $('cntAll').textContent='('+GOODS.length+')';
  $('cntFruit').textContent='('+GOODS.filter(g=>g.cat==='fruit').length+')';
  $('cntVeg').textContent='('+GOODS.filter(g=>g.cat==='veg').length+')';
  $('footTotal').textContent=GOODS.length;
}
function renderChips(){
  const chips = $('chips');
  chips.innerHTML='';
  groupList().forEach(gr=>{
    const b=document.createElement('button');
    b.textContent=gr;
    if(gr===state.group) b.classList.add('active');
    b.onclick=()=>{state.group=gr;renderChips();renderList();};
    chips.appendChild(b);
  });
}
function matchQ(g,q){
  if(!q) return true;
  const s=(g.name+' '+(g.alias||'')+' '+(g.code||'')+' '+(g.group||'')+' '+(g.variety||'')+' '+(g.goodsName||'')).toLowerCase();
  return s.includes(q);
}
function renderList(){
  const q=state.q.trim().toLowerCase();
  const list=$('list');
  const chips=$('chips');
  // --- Landing: no query & group=全部 -> show entry / category picker ---
  if(!q && state.group==='全部'){
    $('stats').innerHTML='';
    if(state.type==='all'){
      chips.style.display='none';
      const fc=GOODS.filter(g=>g.cat==='fruit').length;
      const vc=GOODS.filter(g=>g.cat==='veg').length;
      list.innerHTML=
        '<div class="home">'+
          '<div class="hi">商品验收标准查询</div>'+
          '<div class="tip">在上方输入商品名称、别名或编号搜索<br>或选择下方品类进入分类浏览</div>'+
          '<div class="entry-cards">'+
            '<div class="entry fruit" data-goto="fruit"><div class="big">'+fc+'</div><div class="en">水果</div><div class="ec">个品项 · 点击进入</div></div>'+
            '<div class="entry veg" data-goto="veg"><div class="big">'+vc+'</div><div class="en">蔬菜</div><div class="ec">个品项 · 点击进入</div></div>'+
          '</div>'+
        '</div>';
      list.querySelectorAll('.entry').forEach(el=>{
        el.onclick=()=>{
          state.type=el.dataset.goto;
          state.group='全部';
          document.querySelectorAll('#typeTabs button').forEach(x=>x.classList.toggle('active',x.dataset.type===state.type));
          renderChips();renderList();
        };
      });
    }else{
      chips.style.display='flex';
      // show category grid for this type
      const groups={};
      GOODS.forEach(g=>{
        if(g.cat!==state.type) return;
        const k=g.group||'其他';
        groups[k]=(groups[k]||0)+1;
      });
      const label = state.type==='fruit'?'水果':'蔬菜';
      let cards='';
      Object.keys(groups).sort().forEach(k=>{
        cards+='<div class="cat-card" data-g="'+esc(k)+'"><div class="cn">'+esc(k)+'</div><div class="cc">'+groups[k]+' 个品项</div></div>';
      });
      list.innerHTML=
        '<div class="cat-head"><span>选择'+label+'分类</span><span class="back" data-back="1">← 返回</span></div>'+
        '<div class="cat-grid">'+cards+'</div>';
      list.querySelectorAll('.cat-card').forEach(el=>{
        el.onclick=()=>{
          state.group=el.dataset.g;
          renderChips();renderList();
        };
      });
      const back=list.querySelector('[data-back]');
      if(back) back.onclick=()=>{
        state.type='all';state.group='全部';
        document.querySelectorAll('#typeTabs button').forEach(x=>x.classList.toggle('active',x.dataset.type==='all'));
        renderChips();renderList();
      };
    }
    return;
  }
  // --- Results: query or specific group selected ---
  chips.style.display='flex';
  const arr=GOODS.filter(g=>{
    if(state.type!=='all' && g.cat!==state.type) return false;
    if(state.group!=='全部' && (g.group||'其他')!==state.group) return false;
    return matchQ(g,q);
  });
  $('stats').innerHTML='共 <b>'+arr.length+'</b> 个品项'+(state.type==='all'?'':(state.type==='fruit'?'（水果）':'（蔬菜）'))+(state.group!=='全部'?' · '+state.group:'');
  list.innerHTML='';
  if(arr.length===0){
    list.innerHTML='<div class="empty"><div class="icon">🔍</div>未找到相关商品<br>试试其他关键词或分类</div>';
    return;
  }
  arr.forEach(g=>{
    const card=document.createElement('div');
    card.className='card';
    const isFruit=g.cat==='fruit';
    let meta='';
    if(isFruit){
      meta='<span><b>产地</b> '+(g.origin||'—')+'</span>'+
           '<span><b>上市</b> '+(g.season||'—')+'</span>'+
           (g.unitWeight?'<span><b>单果</b> '+g.unitWeight+'</span>':'')+
           (g.grade?'<span><b>等级</b> '+g.grade+'</span>':'');
    }else{
      meta='<span><b>产地</b> '+(g.origin||'—')+'</span>'+
           '<span><b>应季</b> '+(g.seasonMonth||g.season||'—')+'</span>';
    }
    const alias=(g.alias?'<div class="alias"><b>别名：</b>'+g.alias+'</div>':'')+(g.code?'<div class="alias"><b>编号：</b>'+g.code+'</div>':'');
    card.innerHTML=
      '<div class="row1"><div class="name">'+esc(g.name)+'</div>'+
      '<span class="badge '+g.cat+'">'+(isFruit?'水果':'蔬菜')+'</span></div>'+
      '<div class="meta">'+meta+'</div>'+alias;
    card.onclick=()=>openDetail(g);
    list.appendChild(card);
  });
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ===== Detail =====
function cell(ok,bad,label){
  const o = (ok||'').trim(), b=(bad||'').trim();
  if(!o && !b) return '';
  return '<div class="dim"><div class="dim-title">'+label+'</div><div class="pair">'+
    (o?'<div class="cell ok"><span class="tag">合格</span><div>'+esc(o)+'</div></div>':'<div class="cell ok empty-cell">—</div>')+
    (b?'<div class="cell bad"><span class="tag">拒收</span><div>'+esc(b)+'</div></div>':'<div class="cell bad empty-cell">—</div>')+
    '</div></div>';
}
function openDetail(g){
  const isFruit=g.cat==='fruit';
  $('dTitle').textContent=g.name;
  $('dSub').textContent=(isFruit?'水果 · ':'蔬菜 · ')+(g.group||'')+(g.code?' · '+g.code:'');

  // meta grid
  let metaHtml='';
  if(isFruit){
    metaHtml=metaItem('产地',g.origin)+metaItem('上市期',g.season)+
             metaItem('存储温度',g.storageTemp)+metaItem('合理存储期',g.storageDays)+
             (g.unitWeight?metaItem('单果重',g.unitWeight):'')+
             (g.grade?metaItem('等级',g.grade):'')+
             (g.saleSpec?metaItem('售卖规格',g.saleSpec):'')+
             (g.variety?metaItem('品种',g.variety):'');
  }else{
    metaHtml=metaItem('产地',g.origin)+metaItem('应季',g.seasonMonth||g.season)+
             metaItem('分类',g.group)+metaItem('编号',g.code)+
             (g.alias?metaItem('别名',g.alias):'');
  }
  $('dMeta').innerHTML=metaHtml;

  // dimensions
  let dims='';
  if(isFruit){
    dims=
      cell(g.appearance&&g.appearance.ok,g.appearance&&g.appearance.bad,'外观')+
      cell(g.spec&&g.spec.ok,g.spec&&g.spec.bad,'规格 / 果形')+
      cell(g.color&&g.color.ok,g.color&&g.color.bad,'色泽')+
      cell(g.smell&&g.smell.ok,g.smell&&g.smell.bad,'气味')+
      cell(g.taste&&g.taste.ok,g.taste&&g.taste.bad,'口味 / 口感')+
      cell(g.flesh&&g.flesh.ok,g.flesh&&g.flesh.bad,'果肉 / 内部')+
      cell(g.brix&&g.brix.ok,g.brix&&g.brix.bad,'糖度');
  }else{
    dims=
      cell(g.appearance&&g.appearance.ok,'','应有形态 / 色泽')+
      cell(g.spec&&g.spec.ok,'','规格要求')+
      cell(g.freshness&&g.freshness.ok,'','成熟度 / 新鲜度')+
      cell(g.internal&&g.internal.ok,'','切检内部 / 口感气味')+
      cell(g.hygiene&&g.hygiene.ok,'','洁净与食安')+
      cell(g.packaging&&g.packaging.ok,'','包装与标签')+
      (g.defect?'<div class="dim"><div class="dim-title">特有不合格缺陷</div><div class="pair"><div class="cell bad"><span class="tag">拒收</span><div>'+esc(g.defect)+'</div></div></div></div>':'');
  }

  // reject rules
  let alert='';
  if(isFruit){
    if(g.rejectRule) alert+='<div class="alert-box red" style="margin-bottom:8px"><div class="t">整批拒收条件</div>'+esc(g.rejectRule)+'</div>';
    if(g.lossRate) alert+='<div class="alert-box amber"><div class="t">可接受损耗率</div>'+esc(g.lossRate)+'</div>';
  }else{
    if(g.rejectRule) alert+='<div class="alert-box red" style="margin-bottom:8px"><div class="t">整批拒收红线</div>'+esc(g.rejectRule)+'</div>';
    if(g.acceptLimit) alert+='<div class="alert-box amber" style="margin-bottom:8px"><div class="t">接收限值</div>'+esc(g.acceptLimit)+'</div>';
    if(g.sampling) alert+='<div class="alert-box amber"><div class="t">抽样建议</div>'+esc(g.sampling)+'</div>';
    if(g.storage) alert+='<div class="kv" style="margin-top:8px"><p><span class="k">储存建议</span>'+esc(g.storage)+'</p></div>';
  }

  $('dBody').innerHTML=
    '<div class="sec"><div class="sec-h">验收维度 · 合格 / 拒收对照</div><div class="dim-grid">'+dims+'</div></div>'+
    '<div class="sec"><div class="sec-h">判定与操作</div>'+alert+'</div>';

  $('mask').classList.add('show');
  $('drawer').classList.add('show');
}
function metaItem(k,v){
  if(!v) return '';
  return '<div class="m"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';
}
function closeDetail(){
  $('mask').classList.remove('show');
  $('drawer').classList.remove('show');
}
$('closeBtn').onclick=closeDetail;
$('mask').onclick=closeDetail;

// ===== Type tabs =====
$('typeTabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#typeTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  state.type=b.dataset.type;
  state.group='全部';
  renderChips();renderList();
});

// ===== Search =====
$('q').addEventListener('input',e=>{
  state.q=e.target.value;
  $('clearBtn').style.display=e.target.value?'block':'none';
  renderList();
});
$('clearBtn').onclick=()=>{
  $('q').value='';state.q='';$('clearBtn').style.display='none';renderList();$('q').focus();
};

// ===== Init =====
refreshCounts();
renderChips();
renderList();
</script>
</body>
</html>
